services:
  - type: web
    name: grad-archive-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: GH_REPO
        value: Jerry1-spec/archive-backup
      - key: GH_TOKEN
        sync: false
